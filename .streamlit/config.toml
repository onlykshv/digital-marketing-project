[theme]
base = "dark"
primaryColor = "#5563F5"
backgroundColor = "#0A0A0B"
secondaryBackgroundColor = "#141518"
textColor = "#E3E4E7"
linkColor = "#8B95FF"
borderColor = "#26272B"
showWidgetBorder = true
baseRadius = "6px"
buttonRadius = "6px"
dataframeBorderColor = "#1E1F22"
dataframeHeaderBackgroundColor = "#111214"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
headingFont = "Manrope:https://fonts.googleapis.com/css2?family=Manrope:wght@400..700&display=swap"
codeFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"

[theme.sidebar]
backgroundColor = "#070708"
secondaryBackgroundColor = "#111214"
borderColor = "#1E1F22"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
